name: Send Queued Preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send preview email for queued permits
        env:
          PERMIT_MINER_HMAC_SECRET: ${{ secrets.PERMIT_MINER_HMAC_SECRET }}
          SMTP_HOST:              ${{ secrets.SMTP_HOST }}
          SMTP_PORT:              ${{ secrets.SMTP_PORT }}
          SMTP_USER:              ${{ secrets.SMTP_USER }}
          SMTP_PASS:              ${{ secrets.SMTP_PASS }}
          PREVIEW_RECIPIENTS:     ${{ secrets.PREVIEW_RECIPIENTS }}
          WP_BASE_URL:            ${{ secrets.WP_BASE_URL }}
          PURL_BASE_URL:          ${{ secrets.PURL_BASE_URL }}
          MODE:                   ${{ secrets.MODE }}
          DB_PATH:                permit_miner.db
        run: python -m pipeline.send_queued_preview
